{% extends 'pets/base.html' %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-5">
        <div class="card border border-dark shadow-none bg-white rounded-0">
            <div class="card-header bg-black text-white fw-bold text-center py-3 rounded-0">Portal Login</div>
            <div class="card-body p-4">
                <form method="POST">
                    {% csrf_token %}
                    
                    {% for field in form %}
                        <div class="mb-3">
                            <label class="form-label fw-bold text-dark">{{ field.label }}</label>
                            {{ field }}
                            {% if field.errors %}
                                <div class="text-danger small mt-1">{{ field.errors }}</div>
                            {% endif %}
                        </div>
                    {% endfor %}

                    <button type="submit" class="btn btn-dark w-100 fw-bold mt-2 rounded-0">Login</button>
                </form>
                
                <div class="text-center mt-3">
                    <small class="text-muted">Don't have an account? <a href="{% url 'register' %}" class="text-dark fw-bold text-decoration-underline">Register here</a></small>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
